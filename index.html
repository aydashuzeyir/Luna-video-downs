<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luna Media Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #09090b 0%, #18181b 100%);
            --card-bg: rgba(24, 34, 27, 0.9);
            --accent-color: #ec4899;
            --text-color: #ffffff;
            --text-secondary: #a1a1aa;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 12px;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
            position: relative;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 22px;
            font-weight: 700;
        }

        header p {
            color: var(--text-secondary);
            font-size: 11px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
            backdrop-filter: blur(10px);
        }

        .search-box {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .search-box input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 12px;
            color: var(--text-color);
            font-size: 12px;
            outline: none;
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        .btn {
            background: var(--accent-color);
            border: none;
            color: #fff;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 100%;
        }

        .row-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .panel-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .media-container {
            width: 100%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 6px;
            position: relative;
        }

        .media-container video {
            width: 100%;
            height: 180px;
            object-fit: contain;
            display: block;
            outline: none;
        }

        .info-text {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .folder-list {
            font-size: 11px;
            color: var(--text-secondary);
            max-height: 80px;
            overflow-y: auto;
        }

        .folder-item {
            padding: 4px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }
        .folder-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <header>
        <h1>Luna</h1>
        <p>Media Player & Google Girişi</p>
    </header>

    <!-- Axtarış və Google Keçidi -->
    <div class="card">
        <div class="search-box">
            <input type="text" id="urlInput" placeholder="Video/Musiqi linki yapışdırın...">
            <button class="btn" onclick="loadMedia()">Aç</button>
        </div>
        <div class="row-btns">
            <a href="https://www.google.com" target="_blank" class="btn btn-secondary">🌐 Google-a Get</a>
            <button class="btn btn-secondary" onclick="addNewFolder()">📁 Qovluq yarat</button>
        </div>
    </div>

    <!-- Həmişə Açıq Sürüşdürmə Paneli ilə Video/Musiqi İzləmə -->
    <div class="card">
        <div class="panel-title">
            <span>🎵 Sürüşdürmə Panelikli Pleyer</span>
            <span id="playerStatus" style="color: var(--text-secondary); font-size: 10px;">Hazır</span>
        </div>
        <div class="info-text" id="mediaInfo">Link daxil edərək videonu irəli-geri sürüşdürə bilərsiniz.</div>
        <div class="media-container">
            <!-- controls atributu sayəsində irəli-geri sürüşdürmə çubuğu (progress bar) aktiv olur -->
            <video id="mainPlayer" controls controlslist="nodownload" playsinline src=""></video>
        </div>
    </div>

    <!-- Qovluqlar Bölməsi -->
    <div class="card" id="folderCard" style="display:none;">
        <div class="panel-title"><span>Qovluqlarım</span></div>
        <div class="folder-list" id="folderContainer">
            <div class="folder-item"><span>📁 Əsas Qovluq</span><span>0 fayl</span></div>
        </div>
    </div>

    <script>
        function loadMedia() {
            const val = document.getElementById('urlInput').value.trim();
            const player = document.getElementById('mainPlayer');
            const info = document.getElementById('mediaInfo');
            const status = document.getElementById('playerStatus');

            if (!val) {
                alert('Zəhmət olmasa keçərli link daxil edin!');
                return;
            }

            if (val.startsWith('http')) {
                info.innerHTML = `Oxunan: <a href="${val}" target="_blank" style="color:var(--accent-color);">${val.substring(0, 28)}...</a>`;
                status.innerText = "Oxunur";
                player.src = val;
                player.play().catch(e => console.log(e));
            } else {
                info.innerText = `Axtarıldı: ${val}`;
                status.innerText = "Hazır";
            }
        }

        function addNewFolder() {
            const name = prompt("Yeni qovluğun adı:", "Yükləmələr");
            if (name) {
                const card = document.getElementById('folderCard');
                const container = document.getElementById('folderContainer');
                card.style.display = 'block';
                
                const item = document.createElement('div');
                item.className = 'folder-item';
                item.innerHTML = `<span>📁 ${name}</span><span>0 fayl</span>`;
                container.appendChild(item);
            }
        }
    </script>
</body>
</html>
