<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luna Media & Google</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #09090b 0%, #18181b 100%);
            --card-bg: rgba(24, 34, 27, 0.9);
            --accent-color: #ec4899;
            --text-color: #ffffff;
            --text-secondary: #a1a1aa;
            --border-color: rgba(255, 255, 255, 0.1);
            --app-font: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--app-font);
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 12px;
            max-width: 480px;
            margin: 0 auto;
            font-size: 12px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .header-title h1 {
            color: var(--accent-color);
            font-size: 22px;
            font-weight: 700;
        }

        .header-title p {
            color: var(--text-secondary);
            font-size: 11px;
        }

        .header-icons {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.15); }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
            backdrop-filter: blur(10px);
        }

        .search-box {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .search-box input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 12px;
            color: var(--text-color);
            font-size: inherit;
            outline: none;
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        .btn {
            background: var(--accent-color);
            border: none;
            color: #fff;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: inherit;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 100%;
        }

        .row-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .panel-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .player-action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            cursor: pointer;
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 6px;
            transition: 0.2s;
        }
        .player-action-btn:hover { background: rgba(255, 255, 255, 0.15); }

        .media-container {
            width: 100%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 6px;
        }

        .media-container video {
            width: 100%;
            height: 150px;
            object-fit: contain;
            display: block;
            outline: none;
        }

        .info-text {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .section-title {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .social-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-color);
            font-size: inherit;
            font-weight: 500;
        }

        .folder-list {
            font-size: inherit;
            color: var(--text-secondary);
            max-height: 80px;
            overflow-y: auto;
        }

        .folder-item {
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .folder-item:last-child { border-bottom: none; }

        .settings-group {
            margin-bottom: 8px;
        }
        .settings-group label {
            display: block;
            color: var(--text-secondary);
            font-size: 10px;
            margin-bottom: 4px;
        }
        .settings-group select {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 10px;
            color: var(--text-color);
            font-size: inherit;
            outline: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Luna</h1>
            <p>Media Player & Google Girişi</p>
        </div>
        <div class="header-icons">
            <button class="icon-btn" onclick="toggleSettings()" title="Ayarlar">⚙️</button>
            <button class="icon-btn" onclick="location.reload()" title="Yenilə">🔄</button>
        </div>
    </header>

    <div class="card" id="settingsCard" style="display:none;">
        <div class="panel-title"><span>⚙️ Tətbiq Ayarları və Şriftlər</span></div>
        <div class="settings-group">
            <label>Şrift Üslubu (Font)</label>
            <select id="fontSelect" onchange="changeFont()">
                <option value="'Plus Jakarta Sans', sans-serif">Plus Jakarta Sans</option>
                <option value="'Inter', sans-serif">Inter</option>
                <option value="'Poppins', sans-serif">Poppins</option>
                <option value="sans-serif">Standart (System)</option>
            </select>
        </div>
    </div>

    <div class="card">
        <div class="search-box">
            <input type="text" id="urlInput" placeholder="Spotify / Media linki yapışdırın...">
            <button class="btn" onclick="loadMedia()">Aç</button>
        </div>
        <div class="row-btns">
            <a href="https://www.google.com" target="_blank" class="btn btn-secondary">🌐 Google-a Get</a>
            <button class="btn btn-secondary" onclick="addNewFolder()">📁 New Folder</button>
        </div>
    </div>

    <div class="card">
        <div class="panel-title">
            <span>🎵 Musiqi & Video Pleyeri</span>
            <div class="player-actions">
                <button class="player-action-btn" onclick="reloadMedia()" title="Yenidən Başlat">🔄 Yenilə</button>
                <button class="player-action-btn" onclick="downloadMedia()" title="Yüklə">📥 Yüklə</button>
                <span id="playerStatus" style="color: var(--text-secondary); font-size: 10px;">Hazır</span>
            </div>
        </div>
        <div class="info-text" id="mediaInfo">Link daxil edərək musiqini dinləyə və yükləyə bilərsiniz.</div>
        <div class="media-container">
            <video id="mainPlayer" controls controlslist="nodownload" playsinline src=""></video>
        </div>
    </div>

    <div class="section-title">Dəstəklənən Platformalar</div>
    <div class="social-grid">
        <div class="social-card"><span>🎧</span> Spotify</div>
        <div class="social-card"><span>📌</span> Pinterest</div>
        <div class="social-card"><span>👥</span> Facebook</div>
        <div class="social-card"><span>📸</span> Instagram</div>
        <div class="social-card"><span>🧵</span> Threads</div>
        <div class="social-card"><span>🗲</span> Twitter (X)</div>
    </div>

    <div class="card" id="folderCard" style="display:none;">
        <div class="panel-title"><span>📂 Qovluqlarım</span></div>
        <div class="folder-list" id="folderContainer">
            <div class="folder-item"><span>📁 Əsas Qovluq</span><span id="folderCount">0 fayl</span></div>
        </div>
    </div>

    <script>
        function toggleSettings() {
            const card = document.getElementById('settingsCard');
            card.style.display = card.style.display === 'none' ? 'block' : 'none';
        }

        function changeFont() {
            const fontVal = document.getElementById('fontSelect').value;
            document.documentElement.style.setProperty('--app-font', fontVal);
        }

        function loadMedia() {
            const val = document.getElementById('urlInput').value.trim();
            const player = document.getElementById('mainPlayer');
            const info = document.getElementById('mediaInfo');
            const status = document.getElementById('playerStatus');

            if (!val) {
                alert('Zəhmət olmasa keçərli link daxil edin!');
                return;
            }

            if (val.startsWith('http')) {
                info.innerHTML = `Ekranda göstərilir: <a href="${val}" target="_blank" style="color:var(--accent-color);">${val.substring(0, 25)}...</a>`;
                status.innerText = "Oxunur";
                player.src = val;
                player.load();
                player.play().catch(e => console.log(e));
            } else {
                info.innerText = `Axtarıldı: ${val}`;
                status.innerText = "Hazır";
            }
        }

        function reloadMedia() {
            const player = document.getElementById('mainPlayer');
            if (player.src) {
                player.currentTime = 0;
                player.load();
                player.play().catch(e => console.log(e));
                const status = document.getElementById('playerStatus');
                status.innerText = "Yeniləndi";
                setTimeout(() => status.innerText = "Oxunur", 1500);
            }
        }

        function downloadMedia() {
            const player = document.getElementById('mainPlayer');
            const info = document.getElementById('mediaInfo');
            if (player.src && player.src !== window.location.href) {
                const a = document.createElement('a');
                a.href = player.src;
                a.download = 'media_fayli';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                info.innerHTML = `<span style="color:#10b981;">✔ Fayl uğurla yükləndi və ekranda göstərildi!</span>`;
                
                const card = document.getElementById('folderCard');
                card.style.display = 'block';
                document.getElementById('folderCount').innerText = "1 fayl yükləndi";
            } else {
                alert('Yükləmək üçün əvvəlcə link daxil edin!');
            }
        }

        function addNewFolder() {
            const name = prompt("Yeni qovluğun adı:", "Yükləmələr");
            if (name) {
                const card = document.getElementById('folderCard');
                const container = document.getElementById('folderContainer');
                card.style.display = 'block';
                
                const item = document.createElement('div');
                item.className = 'folder-item';
                item.innerHTML = `<span>📁 ${name}</span><span style="color:var(--accent-color);">0 fayl</span>`;
                container.appendChild(item);
            }
        }
    </script>
</body>
</html>
