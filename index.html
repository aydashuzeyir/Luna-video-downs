<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luna Video Down</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #09090b 0%, #18181b 100%);
            --card-bg: rgba(24, 34, 27, 0.75);
            --accent-color: #ec4899;
            --text-color: #ffffff;
            --text-secondary: #a1a1aa;
            --border-color: rgba(255, 255, 255, 0.08);
            --font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body.theme-cyber { --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%); --accent-color: #ec4899; }
        body.theme-sunset { --bg-gradient: linear-gradient(135deg, #1c1917 0%, #291515 50%, #451a03 100%); --accent-color: #f97316; }
        body.theme-emerald { --bg-gradient: linear-gradient(135deg, #064e3b 0%, #065f46 50%, #022c22 100%); --accent-color: #10b981; }
        body.theme-ocean { --bg-gradient: linear-gradient(135deg, #0f172a 0%, #0369a1 50%, #082f49 100%); --accent-color: #38bdf8; }
        body.theme-purple { --bg-gradient: linear-gradient(135deg, #2e1065 0%, #581c87 50%, #3b0764 100%); --accent-color: #c084fc; }
        body.theme-crimson { --bg-gradient: linear-gradient(135deg, #450a0a 0%, #7f1d1d 50%, #2b0b0b 100%); --accent-color: #f87171; }
        body.theme-midnight { --bg-gradient: linear-gradient(135deg, #020617 0%, #0f172a 100%); --accent-color: #6366f1; }
        body.theme-gold { --bg-gradient: linear-gradient(135deg, #18181b 0%, #27272a 50%, #3f3f46 100%); --accent-color: #eab308; }

        body.font-jakarta { --font-family: 'Plus Jakarta Sans', sans-serif; }
        body.font-poppins { --font-family: 'Poppins', sans-serif; }
        body.font-inter { --font-family: 'Inter', sans-serif; }
        body.font-rubik { --font-family: 'Rubik', sans-serif; }
        body.font-mono { --font-family: 'JetBrains Mono', monospace; }
        body.font-outfit { --font-family: 'Outfit', sans-serif; }
        body.font-space { --font-family: 'Space Grotesk', sans-serif; }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family);
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
            transition: 0.4s ease;
        }

        header {
            text-align: center;
            margin-bottom: 14px;
            margin-top: 5px;
            position: relative;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 28px;
            font-weight: 700;
        }

        header p {
            color: var(--text-secondary);
            font-size: 12px;
            margin-top: 2px;
        }

        .settings-toggle-btn {
            position: absolute;
            right: 0;
            top: 5px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            backdrop-filter: blur(12px);
            transition: 0.2s;
        }

        .settings-toggle-btn:hover {
            border-color: var(--accent-color);
        }

        .settings-wrapper {
            display: none;
            margin-bottom: 12px;
        }

        .settings-wrapper.active {
            display: block;
        }

        .settings-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .settings-label {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        .options-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .options-scroll::-webkit-scrollbar { display: none; }

        .opt-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            white-space: nowrap;
            transition: 0.2s;
        }

        .opt-btn:hover, .opt-btn.active {
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.12);
        }

        .search-container {
            display: flex;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 6px 6px 6px 14px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }

        .search-container input {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 12px;
            width: 100%;
            outline: none;
        }

        .search-container input::placeholder { color: var(--text-secondary); }

        .search-container button {
            background: var(--accent-color);
            border: none;
            color: #fff;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: 0.2s;
            white-space: nowrap;
        }

        .search-container button:hover { opacity: 0.9; }

        .download-result-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 16px;
            display: none;
        }

        .download-result-card.active { display: block; }

        .result-title {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        .download-opt-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 9px 12px;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            margin-bottom: 8px;
            transition: 0.2s;
        }

        .download-opt-btn:hover { border-color: var(--accent-color); background: rgba(255,255,255,0.12); }

        .player-box {
            margin-top: 10px;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            display: none;
        }
        .player-box.active { display: block; }
        .player-box video, .player-box iframe {
            width: 100%;
            height: 200px;
            border: none;
            outline: none;
        }

        .section-title {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .social-icon {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-color);
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .social-icon:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .social-icon span {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        .ic-google { background: rgba(66, 133, 244, 0.15); color: #4285f4; }
        .ic-insta { background: rgba(225, 48, 108, 0.15); color: #e1306c; }
        .ic-tiktok { background: rgba(255, 255, 255, 0.1); color: #ff0050; }
        .ic-spotify { background: rgba(29, 185, 84, 0.15); color: #1db954; }
        .ic-pinterest { background: rgba(189, 8, 28, 0.15); color: #bd081c; }
        .ic-fb { background: rgba(24, 119, 242, 0.15); color: #1877f2; }
        .ic-x { background: rgba(255, 255, 255, 0.1); color: #ffffff; }

        .info-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 11px;
            line-height: 1.4;
        }
    </style>
</head>
<body class="theme-cyber font-jakarta">

    <header>
        <h1>Luna</h1>
        <p>Media & Music Downloader</p>
        <button class="settings-toggle-btn" onclick="toggleSettings()" title="Ayarlar">⚙️</button>
    </header>

    <!-- Ayarlar Paneli -->
    <div class="settings-wrapper" id="settingsWrapper">
        <div class="settings-card">
            <span class="settings-label">Fon Teması:</span>
            <div class="options-scroll" id="themeOptions">
                <button class="opt-btn active" onclick="setTheme('cyber', this)">Neon</button>
                <button class="opt-btn" onclick="setTheme('sunset', this)">Sunset</button>
                <button class="opt-btn" onclick="setTheme('emerald', this)">Emerald</button>
                <button class="opt-btn" onclick="setTheme('ocean', this)">Ocean</button>
                <button class="opt-btn" onclick="setTheme('purple', this)">Purple</button>
                <button class="opt-btn" onclick="setTheme('crimson', this)">Crimson</button>
                <button class="opt-btn" onclick="setTheme('midnight', this)">Midnight</button>
                <button class="opt-btn" onclick="setTheme('gold', this)">Gold</button>
            </div>
        </div>

        <div class="settings-card">
            <span class="settings-label">Yazı Fontu:</span>
            <div class="options-scroll" id="fontOptions">
                <button class="opt-btn active" onclick="setFont('jakarta', this)">Jakarta</button>
                <button class="opt-btn" onclick="setFont('poppins', this)">Poppins</button>
                <button class="opt-btn" onclick="setFont('inter', this)">Inter</button>
                <button class="opt-btn" onclick="setFont('rubik', this)">Rubik</button>
                <button class="opt-btn" onclick="setFont('mono', this)">Mono</button>
                <button class="opt-btn" onclick="setFont('outfit', this)">Outfit</button>
                <button class="opt-btn" onclick="setFont('space', this)">Space</button>
            </div>
        </div>
    </div>

    <!-- Axtarış və Endirmə Paneli -->
    <div class="search-container">
        <input type="text" id="urlInput" placeholder="Video/Musiqi linki yapışdır və ya axtar...">
        <button onclick="handleDownload()">Endir</button>
    </div>

    <!-- Nəticə və Pleyer Paneli -->
    <div class="download-result-card" id="resultCard">
        <div class="result-title">Media Nəticələri:</div>
        <div id="resultList"></div>
        <div class="player-box" id="mediaContainer"></div>
    </div>

    <div class="section-title">Dəstəklənən Mənbələr</div>
    <div class="social-grid">
        <a href="https://www.google.com" target="_blank" class="social-icon">
            <span class="ic-google">🌐</span> Google
        </a>
        <a href="https://www.instagram.com" target="_blank" class="social-icon">
            <span class="ic-insta">📸</span> Instagram
        </a>
        <a href="https://www.tiktok.com" target="_blank" class="social-icon">
            <span class="ic-tiktok">🎵</span> TikTok
        </a>
        <a href="https://open.spotify.com" target="_blank" class="social-icon">
            <span class="ic-spotify">🎧</span> Spotify
        </a>
        <a href="https://www.pinterest.com" target="_blank" class="social-icon">
            <span class="ic-pinterest">📌</span> Pinterest
        </a>
        <a href="https://www.facebook.com" target="_blank" class="social-icon">
            <span class="ic-fb">👥</span> Facebook
        </a>
        <a href="https://twitter.com" target="_blank" class="social-icon">
            <span class="ic-x">✖</span> X (Twitter)
        </a>
    </div>

    <div class="info-card">
        Link daxil edərək birbaşa video izləyə, arxa planda səsləndirə və ya telefonunuza endirə bilərsiniz.
    </div>

    <script>
        function toggleSettings() {
            const wrapper = document.getElementById('settingsWrapper');
            wrapper.classList.toggle('active');
        }

        function setTheme(themeName, btn) {
            document.body.className = document.body.className.replace(/theme-\S+/g, '');
            document.body.classList.add('theme-' + themeName);
            document.querySelectorAll('#themeOptions .opt-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function setFont(fontName, btn) {
            document.body.className = document.body.className.replace(/font-\S+/g, '');
            document.body.classList.add('font-' + fontName);
            document.querySelectorAll('#fontOptions .opt-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function handleDownload() {
            const val = document.getElementById('urlInput').value.trim();
            const resultCard = document.getElementById('resultCard');
            const resultList = document.getElementById('resultList');
            const mediaContainer = document.getElementById('mediaContainer');

            if(!val) {
                window.open('https://www.google.com', '_blank');
                return;
            }

            resultCard.classList.add('active');
            
            if(val.startsWith('http')) {
                resultList.innerHTML = `
                    <a href="${val}" target="_blank" class="download-opt-btn">
                        <span>📥 Videonu/Faylı Birbaşa Endir</span>
                        <span>➔</span>
                    </a>
                    <a href="${val}" target="_blank" class="download-opt-btn" style="background: rgba(99, 102, 241, 0.15);">
                        <span>🎧 Arxa Planda Dinlə / İzlə</span>
                        <span>➔</span>
                    </a>
                `;

                if(val.endsWith('.mp4') || val.endsWith('.webm') || val.endsWith('.mp3')) {
                    mediaContainer.classList.add('active');
                    mediaContainer.innerHTML = `<video controls playsinline src="${val}"></video>`;
                } else {
                    mediaContainer.classList.remove('active');
                    mediaContainer.innerHTML = '';
                }
            } else {
                window.open('https://www.google.com/search?q=' + encodeURIComponent(val), '_blank');
            }
        }
    </script>
</body>
</html>
